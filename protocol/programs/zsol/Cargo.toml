[package]
name = "zsol"
version = "0.1.0"
description = "zSOL — shielded SOL with association-set proofs. UNAUDITED."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zsol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Groth16 verification over BN254 using Solana's alt_bn128 syscalls.
groth16-solana = "0.0.3"
