<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="zSOL banner">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="glowP" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="88%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B57BFF"/>
      <stop offset="100%" stop-color="#3BE39B"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="#0A0812"/>
  <rect width="1500" height="500" fill="url(#glowP)"/>
  <rect width="1500" height="500" fill="url(#glowG)"/>

  <!-- faint deposit-pool grid, association-set motif -->
  <g opacity="0.5">
    <!-- rows of small nodes; a few gold "flagged", most gradient "clean" -->
  </g>

  <!-- emblem -->
  <g transform="translate(150,250)">
    <circle r="118" fill="none" stroke="url(#g)" stroke-width="12"/>
    <circle r="70" fill="url(#g)" opacity="0.16"/>
    <path d="M0 -84 L60 -62 V4 C60 46 36 74 0 91 C-36 74 -60 46 -60 4 V-62 Z"
          fill="none" stroke="#F4B728" stroke-width="7"/>
    <path d="M0 -48 L34 -35 V4 C34 30 18 48 0 58 C-18 48 -34 30 -34 4 V-35 Z"
          fill="#F4B728" opacity="0.9"/>
    <path d="M-16 -8 h32 l-32 30 h32" fill="none" stroke="#0A0812" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="330" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="url(#txt)">zSOL</text>
  <text x="336" y="286" font-family="ui-monospace, Menlo, monospace" font-size="27" letter-spacing="1.5" fill="#B4AAC8">Shielded SOL on Solana</text>
  <text x="336" y="330" font-family="ui-monospace, Menlo, monospace" font-size="21" letter-spacing="1" fill="#7E7591">Privacy proven on <tspan fill="#F4B728">Zcash</tspan>, brought to Solana. Prove where your money <tspan font-style="italic" fill="#9DE9C4">didn't</tspan> come from.</text>

  <!-- powered-by strip -->
  <g transform="translate(336,378)">
    <rect x="0" y="0" width="250" height="40" rx="20" fill="#14111E" stroke="#2A2340"/>
    <circle cx="24" cy="20" r="6" fill="url(#g)"/>
    <text x="40" y="26" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="1.5" fill="#B4AAC8">POWERED BY <tspan fill="#C89BFF" font-weight="700">STONK</tspan></text>
  </g>
</svg>
